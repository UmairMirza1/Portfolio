<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 746" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Data platform architecture</title>
  <desc id="d">Satellite imagery and field data are processed by Apache Airflow on EKS into an Apache Iceberg data lake on S3 Tables alongside PostGIS with H3 indexing. Trino queries the storage layer, and the Go backend, secured with Cognito OAuth, serves Farmdar apps and the production API. Everything runs on AWS, managed with Terraform, Helm and GitHub Actions.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5fd0e6"/>
    </marker>
    <style>
      .box{fill:#121a33;stroke:#2f4a6d;stroke-width:1.5}
      .key{fill:#10233a;stroke:#2eb0cb;stroke-width:2}
      .h{fill:#ffffff;font-size:19px;font-weight:700}
      .s{fill:#a9bdd3;font-size:14px}
      .lbl{fill:#7f93ab;font-size:12px;letter-spacing:1.5px}
      .ln{stroke:#5fd0e6;stroke-width:2;fill:none;marker-end:url(#a)}
    </style>
  </defs>

  <rect width="600" height="746" rx="16" fill="#0b1020"/>

  <!-- Sources -->
  <rect class="box" x="20" y="20" width="270" height="64" rx="10"/>
  <text class="h" x="155" y="48" text-anchor="middle">Satellite imagery</text>
  <text class="s" x="155" y="70" text-anchor="middle">Planet 3 m</text>
  <rect class="box" x="310" y="20" width="270" height="64" rx="10"/>
  <text class="h" x="445" y="48" text-anchor="middle">Field data</text>
  <text class="s" x="445" y="70" text-anchor="middle">five years, hand-labelled</text>
  <path class="ln" d="M155 84V118"/>
  <path class="ln" d="M445 84V118"/>

  <!-- Orchestration -->
  <rect class="key" x="20" y="120" width="560" height="84" rx="10"/>
  <text class="h" x="300" y="148" text-anchor="middle">Apache Airflow on EKS</text>
  <text class="s" x="300" y="170" text-anchor="middle">10+ DAGs for imagery ETL and MLOps</text>
  <text class="s" x="300" y="190" text-anchor="middle">custom Kubernetes operator: one Papermill pod per task</text>
  <path class="ln" d="M300 204V238"/>

  <!-- Storage -->
  <rect x="20" y="240" width="560" height="110" rx="12" fill="none" stroke="#2f4a6d" stroke-dasharray="6 5"/>
  <text class="lbl" x="36" y="262">STORAGE</text>
  <rect class="key" x="36" y="272" width="330" height="64" rx="10"/>
  <text class="h" x="201" y="299" text-anchor="middle">Apache Iceberg on S3 Tables</text>
  <text class="s" x="201" y="321" text-anchor="middle">TB-scale data lake</text>
  <rect class="box" x="380" y="272" width="184" height="64" rx="10"/>
  <text class="h" x="472" y="299" text-anchor="middle">PostGIS</text>
  <text class="s" x="472" y="321" text-anchor="middle">H3 indexing</text>
  <path class="ln" d="M300 350V384"/>

  <!-- Query -->
  <rect class="key" x="20" y="386" width="560" height="60" rx="10"/>
  <text class="h" x="300" y="413" text-anchor="middle">Trino</text>
  <text class="s" x="300" y="434" text-anchor="middle">SQL over raster and vector data</text>
  <path class="ln" d="M300 446V480"/>

  <!-- Serving -->
  <rect class="key" x="20" y="482" width="560" height="74" rx="10"/>
  <text class="h" x="300" y="510" text-anchor="middle">Go backend</text>
  <text class="s" x="300" y="531" text-anchor="middle">100K+ requests a day, P95 latency down 40%</text>
  <text class="s" x="300" y="549" text-anchor="middle">AWS Cognito OAuth, tokens verified via JWKS</text>
  <path class="ln" d="M300 556V572H155V590"/>
  <path class="ln" d="M300 572H445V590"/>

  <!-- Consumers -->
  <rect class="box" x="20" y="592" width="270" height="64" rx="10"/>
  <text class="h" x="155" y="620" text-anchor="middle">Farmdar apps</text>
  <text class="s" x="155" y="642" text-anchor="middle">YieldPro and other products</text>
  <rect class="box" x="310" y="592" width="270" height="64" rx="10"/>
  <text class="h" x="445" y="620" text-anchor="middle">Production API</text>
  <text class="s" x="445" y="642" text-anchor="middle">FFC · Corteva · Engro · Kubota</text>

  <!-- Infrastructure -->
  <rect x="20" y="676" width="560" height="50" rx="10" fill="none" stroke="#2f4a6d" stroke-dasharray="6 5"/>
  <text class="s" x="300" y="706" text-anchor="middle"><tspan fill="#ffffff" font-weight="700">AWS</tspan>  ·  Terraform  ·  Helm  ·  GitHub Actions</text>
</svg>
