<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 760" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Unified Go backend and sign-in</title>
  <desc id="d">Web and mobile apps for YieldPro, CropScan, eSurvey and DeveloPro sign in through the Cognito hosted UI with the authorization-code flow, PKCE on mobile, and Google Workspace SAML for staff. Requests reach one Go backend through a load balancer; the backend verifies tokens locally against cached JWKS keys and reads organisation and group membership from the database. Partners use a separate API Gateway with a Cognito authorizer, machine-to-machine clients and scopes, connected privately to the same service. One PostGIS database with an optional read-only pool sits behind it.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5fd0e6"/></marker>
    <style>
      .box{fill:#121a33;stroke:#2f4a6d;stroke-width:1.5}
      .key{fill:#10233a;stroke:#2eb0cb;stroke-width:2}
      .wip{fill:#2a1f0c;stroke:#d39a2c;stroke-width:1.5;stroke-dasharray:5 4}
      .h{fill:#ffffff;font-size:19px;font-weight:700}
      .s{fill:#a9bdd3;font-size:14px}
      .lbl{fill:#7f93ab;font-size:12px;letter-spacing:1.5px}
      .ln{stroke:#5fd0e6;stroke-width:2;fill:none;marker-end:url(#a)}
      .grp{fill:none;stroke:#2f4a6d;stroke-dasharray:6 5}
    </style>
  </defs>
  <rect width="600" height="760" rx="16" fill="#0b1020"/>
  <rect class="box" x="20" y="20" width="560" height="64" rx="10"/>
  <text class="h" x="300" y="48.5" text-anchor="middle">Farmdar apps, web and mobile</text>
  <text class="s" x="300" y="69.5" text-anchor="middle">YieldPro · CropScan · eSurvey · DeveloPro</text>
  <path class="ln" d="M160 84V118"/>
  <path class="ln" d="M440 84V172"/>
  <rect class="key" x="20" y="120" width="280" height="104" rx="10"/>
  <text class="h" x="160" y="149.5" text-anchor="middle">Cognito hosted UI</text>
  <text class="s" x="160" y="170.5" text-anchor="middle">authorization-code flow</text>
  <text class="s" x="160" y="189.5" text-anchor="middle">PKCE on mobile</text>
  <text class="s" x="160" y="208.5" text-anchor="middle">Google SSO for staff</text>
  <rect class="box" x="320" y="174" width="260" height="50" rx="10"/>
  <text class="h" x="450" y="205" text-anchor="middle">Load balancer</text>
  <path class="ln" d="M300 172H318"/>
  <rect class="box" x="20" y="256" width="260" height="104" rx="10"/>
  <text class="h" x="150" y="285.5" text-anchor="middle">Partner API</text>
  <text class="s" x="150" y="306.5" text-anchor="middle">API Gateway</text>
  <text class="s" x="150" y="325.5" text-anchor="middle">Cognito authorizer</text>
  <text class="s" x="150" y="344.5" text-anchor="middle">M2M clients, read/write scopes</text>
  <path class="ln" d="M450 224V398"/>
  <path class="ln" d="M150 360V380H300V398"/>
  <rect class="key" x="20" y="400" width="560" height="140" rx="10"/>
  <text class="h" x="300" y="438" text-anchor="middle">One Go backend</text>
  <text class="s" x="300" y="459" text-anchor="middle">one binary, a module per product</text>
  <text class="s" x="300" y="478" text-anchor="middle">tokens verified locally against cached JWKS keys</text>
  <text class="s" x="300" y="497" text-anchor="middle">organisation and group access read from the database</text>
  <text class="s" x="300" y="516" text-anchor="middle">per-handler timeouts · hardened, non-root pods on EKS</text>
  <path class="ln" d="M300 540V574"/>
  <rect class="box" x="20" y="576" width="560" height="64" rx="10"/>
  <text class="h" x="300" y="604.5" text-anchor="middle">PostgreSQL / PostGIS</text>
  <text class="s" x="300" y="625.5" text-anchor="middle">one schema for all products · read-only pool for heavy queries</text>
  <rect class="grp" x="20" y="660" width="560" height="80" rx="12"/>
  <text class="lbl" x="36" y="682">ROLLOUT</text>
  <text class="s" x="300" y="706" text-anchor="middle">dual-mode tokens behind a feature flag → hosted UI → legacy auth removed</text>
</svg>
