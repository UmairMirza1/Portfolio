<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">YieldPro architecture</title>
  <desc id="d">Satellite imagery feeds Airflow pipelines that compute crop-health indices, stress maps and reports for each subscribed field. Fields, subscriptions and results are stored in PostGIS. A Go API applies role-based access by organisation, group and product. Vector tiles are generated on request in PostGIS with ST_AsMVT and filtered by organisation; raster layers come from a tile server. Growers use an Angular and Mapbox GL web app and receive PDF reports.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5fd0e6"/></marker>
    <style>
      .box{fill:#121a33;stroke:#2f4a6d;stroke-width:1.5}
      .key{fill:#10233a;stroke:#2eb0cb;stroke-width:2}
      .wip{fill:#2a1f0c;stroke:#d39a2c;stroke-width:1.5;stroke-dasharray:5 4}
      .h{fill:#ffffff;font-size:19px;font-weight:700}
      .s{fill:#a9bdd3;font-size:14px}
      .lbl{fill:#7f93ab;font-size:12px;letter-spacing:1.5px}
      .ln{stroke:#5fd0e6;stroke-width:2;fill:none;marker-end:url(#a)}
      .grp{fill:none;stroke:#2f4a6d;stroke-dasharray:6 5}
    </style>
  </defs>
  <rect width="600" height="700" rx="16" fill="#0b1020"/>
  <rect class="box" x="20" y="20" width="560" height="64" rx="10"/>
  <text class="h" x="300" y="48.5" text-anchor="middle">Satellite imagery</text>
  <text class="s" x="300" y="69.5" text-anchor="middle">Planet · Sentinel-2</text>
  <path class="ln" d="M300 84V118"/>
  <rect class="key" x="20" y="120" width="560" height="84" rx="10"/>
  <text class="h" x="300" y="149" text-anchor="middle">Airflow pipelines</text>
  <text class="s" x="300" y="170" text-anchor="middle">per-field indices, stress maps and</text>
  <text class="s" x="300" y="189" text-anchor="middle">PDF reports from the same outputs</text>
  <path class="ln" d="M300 204V238"/>
  <rect class="box" x="20" y="240" width="560" height="64" rx="10"/>
  <text class="h" x="300" y="268.5" text-anchor="middle">PostGIS</text>
  <text class="s" x="300" y="289.5" text-anchor="middle">fields · subscriptions · results</text>
  <path class="ln" d="M300 304V338"/>
  <rect class="key" x="20" y="340" width="560" height="84" rx="10"/>
  <text class="h" x="300" y="369" text-anchor="middle">Go API</text>
  <text class="s" x="300" y="390" text-anchor="middle">RBAC: organisation → groups → products</text>
  <text class="s" x="300" y="409" text-anchor="middle">every query scoped to the user's organisation</text>
  <path class="ln" d="M300 424V442H155V458"/>
  <path class="ln" d="M300 442H445V458"/>
  <rect class="box" x="20" y="460" width="270" height="84" rx="10"/>
  <text class="h" x="155" y="489" text-anchor="middle">Vector tiles</text>
  <text class="s" x="155" y="510" text-anchor="middle">ST_AsMVT, built on request</text>
  <text class="s" x="155" y="529" text-anchor="middle">filtered by organisation</text>
  <rect class="box" x="310" y="460" width="270" height="84" rx="10"/>
  <text class="h" x="445" y="489" text-anchor="middle">Raster tiles</text>
  <text class="s" x="445" y="510" text-anchor="middle">tile server for</text>
  <text class="s" x="445" y="529" text-anchor="middle">crop-health layers</text>
  <path class="ln" d="M155 544V578"/>
  <path class="ln" d="M445 544V578"/>
  <rect class="key" x="20" y="580" width="560" height="100" rx="10"/>
  <text class="h" x="300" y="617" text-anchor="middle">YieldPro web app</text>
  <text class="s" x="300" y="638" text-anchor="middle">Angular + Mapbox GL map analytics</text>
  <text class="s" x="300" y="657" text-anchor="middle">per-field reports for growers and agronomists</text>
</svg>
